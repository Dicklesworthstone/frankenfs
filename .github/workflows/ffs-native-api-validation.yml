name: NTFS ADS permission planted-red proof
on:
  push:
    branches: [validation/ffs-native-api-20261123]
permissions:
  contents: read
concurrency:
  group: ffs-native-api-20261123
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: "-Z threads=1"
  CARGO_HTTP_USER_AGENT: "frankenfs-agent (+https://github.com/Dicklesworthstone/frankenfs)"
jobs:
  planted-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare pinned compiler and runner memory
        run: |
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y fuse3 pkg-config
          validation_swap=$(sudo mktemp /mnt/ffs-ads-red-XXXXXX.swap)
          sudo fallocate -l 12G "$validation_swap"
          sudo chmod 0600 "$validation_swap"
          sudo mkswap "$validation_swap"
          sudo swapon "$validation_swap"
          free -h
          df -h .
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ntfs-writer-integrity
          cache-on-failure: "true"
          cache-workspace-crates: "true"
      - name: Verify exact regression candidate without rewriting source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "e7466d7a85dd818c82922337040c240180270f8b"
          python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/ffs-native-api-validation.yml",
              "crates/ffs-ntfs/src/reader/filesystem.rs",
              "crates/ffs-ntfs/tests/persistence_prefix/transforms.rs",
              "crates/ffs/src/native.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^1", "HEAD"], text=True
          ).splitlines())
          assert changed == expected, (changed, expected)
          PY
          cargo fmt --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "FFS_TESTED_COMMIT|$(git rev-parse HEAD)"
          echo "FFS_TESTED_TREE|$(git rev-parse HEAD^{tree})"
      - name: Compile persistence regressions before measuring the failure
        run: cargo test --locked -p ffs-ntfs --test persistence_prefix --no-run
      - name: Prove existing ADS creation incorrectly requires parent add permission
        env:
          TEST_NAME: transforms::ntfs_mapped_stream_creation_uses_file_authority_without_directory_add_rights
        run: |
          set +e
          cargo test --locked -p ffs-ntfs --test persistence_prefix "$TEST_NAME" -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/ffs-ads-planted-red.log"
          test_status=${PIPESTATUS[0]}
          set -e
          export FFS_RED_TEST_STATUS="$test_status"
          python3 - <<'PY'
          import os
          import pathlib
          log = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ffs-ads-planted-red.log").read_text()
          source_path = pathlib.Path("crates/ffs-ntfs/tests/persistence_prefix/transforms.rs")
          source = source_path.read_text()
          test_name = os.environ["TEST_NAME"]
          definition = source.index("fn " + test_name.split("::")[-1] + "()")
          first_create = source.index("let direct = fs", definition)
          first_unwrap = source.index(".unwrap();", first_create)
          expected_line = source[:first_unwrap].count("\n") + 1
          assert os.environ["FFS_RED_TEST_STATUS"] == "101", log
          assert "running 1 test" in log, log
          assert "test result: FAILED. 0 passed; 1 failed; 0 ignored;" in log, log
          assert test_name in log, log
          assert str(source_path) + ":" + str(expected_line) + ":" in log, log
          assert "called " + chr(96) + "Result::unwrap()" + chr(96) + " on an " + chr(96) + "Err" + chr(96) + " value: PermissionDenied" in log, log
          print("FFS_PLANTED_RED_CONFIRMED|" + test_name + "|PermissionDenied|first_create")
          PY
      - name: Confirm test execution did not change source
        if: ${{ !cancelled() }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Retain exact negative regression output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-ads-planted-red
          path: ${{ runner.temp }}/ffs-ads-planted-red.log
          if-no-files-found: warn
