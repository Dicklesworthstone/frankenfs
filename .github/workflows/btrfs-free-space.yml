name: Btrfs free-space CoW

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btrfs-free-space.yml'
      - 'crates/ffs-core/src/btrfs_free_space.rs'
      - 'crates/ffs-core/src/btrfs_free_space/**'
      - 'crates/ffs-core/src/writeback_cache.rs'
      - 'crates/ffs-core/tests/btrfs_commit_crash_window.rs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/btrfs-free-space.yml'
      - 'crates/ffs-core/src/btrfs_free_space.rs'
      - 'crates/ffs-core/src/btrfs_free_space/**'
      - 'crates/ffs-core/src/writeback_cache.rs'
      - 'crates/ffs-core/tests/btrfs_commit_crash_window.rs'

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_BACKTRACE: '1'
      FFS_REQUIRE_ORACLES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install required filesystem oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs e2fsprogs pkg-config libfuse3-dev
          command -v mkfs.btrfs
          command -v btrfs

      - name: Core formatting check
        run: cargo fmt -p ffs-core --check

      - name: Reservation unit regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ffs-core --locked --lib btrfs_free_space::tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/fst-unit.log"
          grep -Eq 'test result: ok\. ([1-9][0-9]+) passed;' "$RUNNER_TEMP/fst-unit.log"

      - name: Real-image crash-window and publication regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ffs-core --locked --test btrfs_commit_crash_window -- --nocapture 2>&1 | tee "$RUNNER_TEMP/fst-crash.log"
          ! grep -Eiq 'skipping|unavailable' "$RUNNER_TEMP/fst-crash.log"
          grep -Eq 'test result: ok\. ([1-9][0-9]*) passed;' "$RUNNER_TEMP/fst-crash.log"
          cargo test -p ffs-core --locked --lib btrfs_commit_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/fst-publication.log"
          ! grep -Eiq 'skipping|unavailable' "$RUNNER_TEMP/fst-publication.log"
          grep -Eq 'test result: ok\. ([6-9]|[1-9][0-9]+) passed;' "$RUNNER_TEMP/fst-publication.log"

      - name: Check all core targets
        run: cargo check -p ffs-core --locked --all-targets

      - name: Core Clippy
        run: cargo clippy -p ffs-core --locked --all-targets -- -D warnings

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btrfs-cow-${{ github.sha }}-${{ matrix.runner }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fst-*.log
