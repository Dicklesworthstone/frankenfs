name: xfstests

# Runs the curated generic xfstests subset against a real FrankenFS FUSE mount
# (FSTYP=fuse, FUSE_SUBTYP=.ffs via scripts/e2e/mount.fuse.ffs) and publishes
# per-test pass/fail/not-run results, once per format (ext4, btrfs).
# TEST_DEV/SCRATCH_DEV are throwaway image files on this ephemeral runner, which is what makes the destructive
# XFSTESTS_REAL_RUN_ACK appropriate here and nowhere else.
#
# First baseline (2026-09-30, run 36749010714): generic/001 and generic/524
# pass; 003, 013, 030, 035, 062 and 112 fail (each a tracked bead); 068, 231
# and 321 do not apply to FUSE. Kept outside the main CI workflow while the
# known failures are open.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  xfstests-fuse:
    name: xfstests generic subset on FrankenFS (FUSE, ${{ matrix.fs }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Same curated list on both formats; each format has its own baseline
        # (the btrfs one starts empty: its first runs are the measurement).
        include:
          - fs: ext4
            mkfs: mkfs.ext4 -q -F
            baseline: scripts/e2e/xfstests_baseline.json
          - fs: btrfs
            mkfs: mkfs.btrfs -q -f
            baseline: scripts/e2e/xfstests_baseline_btrfs.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install FUSE, ext4 and xfstests prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 libfuse3-dev e2fsprogs btrfs-progs \
            build-essential autoconf automake libtool libtool-bin pkg-config \
            uuid-dev libacl1-dev libattr1-dev libaio-dev libgdbm-dev \
            libgdbm-compat-dev liburing-dev libcap-dev xfslibs-dev xfsprogs \
            acl attr psmisc bc dbench fio gawk quota sqlite3 uuid-runtime

      - name: Cache xfstests build
        id: xfstests-cache
        uses: actions/cache@v4
        with:
          path: ~/xfstests-dev
          key: xfstests-dev-v2026.03.20-${{ runner.os }}-v1

      - name: Build xfstests
        if: steps.xfstests-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2026.03.20 \
            https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git ~/xfstests-dev
          make -C ~/xfstests-dev -j"$(nproc)"

      - name: Build FrankenFS
        run: cargo build -p ffs-cli -p ffs-harness

      - name: Install the mount helper and test images
        run: |
          set -euo pipefail
          sudo install -m 0755 target/debug/ffs-cli /usr/local/bin/ffs-cli
          sudo install -m 0755 scripts/e2e/mount.fuse.ffs /sbin/mount.fuse.ffs
          # Core dumps to a plain file, so a test's own `ulimit -c 0` holds.
          # With the runner's systemd-coredump pipe the kernel ignores
          # RLIMIT_CORE=0, and xfstests fails whichever test's window the
          # asynchronously recorded core lands in: generic/564, 394 and 749
          # kill their own tool on purpose (SIGXFSZ/SIGBUS), and 564's core
          # was once charged to 565 (bd-6ljdy). A tool that crashes without
          # the ulimit still leaves a `core` file that check reports.
          sudo sysctl -w kernel.core_pattern=core
          # xfstests' permission tests run as these users.
          sudo useradd -m fsgqa || true
          sudo useradd -m fsgqa2 || true
          sudo useradd 123456-fsgqa || true
          img="$RUNNER_TEMP/xfstests-images"
          mkdir -p "$img"
          # 4G (sparse): generic/213 needs df to report 1 GiB + 1 MiB
          # available on TEST after the tests before it. btrfs reports only
          # data-usable space (as the kernel does), which a 2G image no longer
          # has once metadata chunks and earlier tests' files take their share.
          truncate -s 4G "$img/test.img" "$img/scratch.img"
          ${{ matrix.mkfs }} "$img/test.img"
          ${{ matrix.mkfs }} "$img/scratch.img"
          # fusermount3 mountpoints must be in an AppArmor-allowed location.
          sudo mkdir -p /mnt/ffs-test /mnt/ffs-scratch
          {
            echo "XFSTESTS_DIR=$HOME/xfstests-dev"
            echo "TEST_DEV=$img/test.img"
            echo "SCRATCH_DEV=$img/scratch.img"
            echo "TEST_DIR=/mnt/ffs-test"
            echo "SCRATCH_MNT=/mnt/ffs-scratch"
          } >>"$GITHUB_ENV"

      - name: Run xfstests generic subset against FrankenFS
        env:
          FSTYP: fuse
          FUSE_SUBTYP: .ffs
          XFSTESTS_MODE: run
          XFSTESTS_FILTER: generic
          XFSTESTS_DRY_RUN: 0
          XFSTESTS_STRICT: 0
          XFSTESTS_REAL_RUN_ACK: xfstests-may-mutate-test-and-scratch-devices
          XFSTESTS_BASELINE_JSON: ${{ github.workspace }}/${{ matrix.baseline }}
          FFS_MOUNT_LOG_DIR: ${{ runner.temp }}
          # No FUSE subtype: the mount type must read as plain `fuse`.
          FFS_FUSE_SUBTYPE: ""
        # The regression gate runs the subset and compares each test with
        # scripts/e2e/xfstests_baseline.json (the first measured run): a
        # baseline pass that no longer passes fails the job; the known
        # failures are tracked beads (bd-wl17e, bd-55gzo, bd-tqa7z, bd-2cgl5,
        # bd-uyo9k, bd-msbk2) and a new pass is reported as progress.
        run: sudo -E env "PATH=$PATH" ./scripts/e2e/ffs_xfstests_regression_gate.sh

      - name: Make root-owned artifacts readable
        if: always()
        run: sudo chmod -R a+rX artifacts "$RUNNER_TEMP" || true

      - name: Summarize results
        if: always()
        run: |
          shopt -s nullglob
          for f in artifacts/e2e/*_ffs_xfstests_e2e*/xfstests/results.json; do
            python3 - "$f" <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import json, sys, collections
          data = json.load(open(sys.argv[1]))
          tests = data.get("tests", [])
          counts = collections.Counter(t.get("status") for t in tests)
          print("### xfstests on FrankenFS (FUSE, ${{ matrix.fs }})\n")
          print("| status | count |\n|---|---|")
          for status, n in sorted(counts.items()):
              print(f"| {status} | {n} |")
          print("\n| test | status |\n|---|---|")
          for t in tests:
              print(f"| {t.get('id')} | {t.get('status')} |")
          PY
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-fuse-${{ matrix.fs }}
          if-no-files-found: warn
          path: |
            artifacts/e2e/**/xfstests/**
            ${{ runner.temp }}/ffs-mount-*.log
            ~/xfstests-dev/results/**
