name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: ffs=debug

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Environment
        run: |
          echo "::group::System Info"
          uname -a
          cat /etc/os-release 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Rust Toolchain"
          rustc -Vv
          cargo -V
          echo "::endgroup::"
          echo "::group::Available Resources"
          nproc
          free -h 2>/dev/null || true
          df -h .
          echo "::endgroup::"

      - name: Forbidden dependency scan
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          forbidden = {
              "tokio",
              "tokio-stream",
              "tokio-util",
              "hyper",
              "hyper-rustls",
              "hyper-util",
              "reqwest",
              "axum",
              "tower",
              "tower-http",
              "tower-layer",
              "tower-service",
              "async-std",
              "smol",
          }

          lockfile = Path("Cargo.lock")
          if not lockfile.exists():
              print("::error file=Cargo.lock::Cargo.lock is required for dependency scanning")
              sys.exit(1)

          package_names = set(
              re.findall(r'^name = "([^"]+)"$', lockfile.read_text(encoding="utf-8"), re.MULTILINE)
          )
          found = sorted(package_names & forbidden)
          if found:
              print(
                  "::error title=Forbidden dependency detected::Cargo.lock contains "
                  f"forbidden async/runtime dependency package(s): {', '.join(found)}"
              )
              sys.exit(1)

          print("Forbidden dependency scan passed")
          PY

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Harness LOC growth guard
        if: github.event_name == 'pull_request'
        run: cargo run -p ffs-ops -- harness-loc-growth-guard --base origin/${{ github.base_ref }} --head HEAD --format github

      - name: Unit tests
        run: cargo test --workspace

      - name: Install ext4 tools for parity contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      # The ext4 reference and kernel-differential suites compare against
      # mkfs.ext4/debugfs output. Without e2fsprogs those tests report a skip
      # marker, which the evidence model classifies as Skipped rather than
      # Passed, so the step fails closed instead of passing vacuously.
      # btrfs-reference is deliberately not selected here: it additionally pins
      # btrfs-progs to the golden's anchor version.
      - name: Executed parity contracts
        run: |
          cargo run -p ffs-harness -- parity \
            --verify ext4-journal \
            --verify ext4-reference \
            --verify ext4-kernel-differential \
            --verify mvcc-lib \
            --verify repair-lib \
            --verify parity-honesty \
            --local

      # §22.1 names seven gate commands. This executes them and fails the job when
      # a gate that HAS tests does not pass. A filter that selects zero tests is
      # reported as `not_implemented` and can never be green here.
      - name: Canonical §22 gates
        run: |
          mkdir -p artifacts/canonical-gates
          cargo run -p ffs-harness -- gates --all --local --out artifacts/canonical-gates/report.json

      - name: ffs-block all-features check
        run: cargo check -p ffs-block --all-features --all-targets

      - name: ffs-block all-features tests
        run: cargo test -p ffs-block --all-features

  # Golden verification requires fixture images which are large.
  # This job regenerates them from scratch for consistent verification.
  golden-verification:
    name: Golden Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      SKIP_MOUNT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Environment
        run: |
          echo "::group::System Info"
          uname -a
          cat /etc/os-release 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Rust Toolchain"
          rustc -Vv
          cargo -V
          echo "::endgroup::"
          echo "::group::Available Resources"
          nproc
          free -h 2>/dev/null || true
          df -h .
          echo "::endgroup::"

      - name: Install ext4 tools for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Verify fixture checksums
        run: |
          set -euo pipefail
          if ! (cd conformance/fixtures && sha256sum -c checksums.sha256); then
            echo "::error file=conformance/fixtures/checksums.sha256::Checksum mismatch - fixtures changed without updating checksums"
            exit 1
          fi

      - name: Verify golden checksums
        run: |
          set -euo pipefail
          if ! (cd conformance/golden && sha256sum -c checksums.sha256); then
            echo "::error file=conformance/golden/checksums.sha256::Checksum mismatch - golden outputs changed without updating checksums"
            exit 1
          fi

      - name: Run canonical golden verification
        run: ./scripts/verify_golden.sh

      - name: Run smoke E2E
        run: ./scripts/e2e/ffs_smoke.sh

      - name: Run xfstests subset planning (bd-32yn.7)
        env:
          XFSTESTS_MODE: plan
          XFSTESTS_FILTER: all
          XFSTESTS_STRICT: 1
        run: ./scripts/e2e/ffs_xfstests_e2e.sh

      - name: Run xfstests regression gate
        run: ./scripts/e2e/ffs_xfstests_regression_gate.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          if-no-files-found: warn
          path: |
            target/debug/deps/ffs-*.d
            conformance/golden/*.json
            conformance/fixtures/checksums.sha256
            artifacts/canonical-gates/report.json
            artifacts/e2e/**/*.log
            artifacts/e2e/**/xfstests/*.json
            artifacts/e2e/**/xfstests/*.md
            artifacts/e2e/**/xfstests/*.txt
            artifacts/e2e/**/xfstests/*.xml

  # FUSE E2E tests — mount a real ext4 image and exercise the VFS
  fuse-e2e:
    name: FUSE E2E
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install FUSE and ext4 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev e2fsprogs btrfs-progs

      - name: Verify FUSE availability
        run: |
          ls -la /dev/fuse
          which fusermount3 || which fusermount
          echo "FUSE is available"

      - name: Build test binaries
        run: cargo test -p ffs-harness --no-run

      - name: Run relocated ops tests
        run: cargo test -p ffs-ops -- --nocapture

      - name: Run FUSE E2E tests
        run: cargo test -p ffs-harness --test fuse_e2e -- --nocapture

      - name: Run shell E2E suites
        run: ./scripts/e2e/ffs_smoke.sh

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuse-e2e-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/e2e/**/*.log
            artifacts/e2e/**/*.json

  # Warn if goldens are modified in a PR
  golden-change-check:
    name: Golden Change Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for golden changes
        run: |
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          if echo "$changed_files" | grep -qE '(^conformance/golden/|^conformance/fixtures/)'; then
            echo "::warning::Golden outputs modified - ensure this is intentional"
            echo ""
            echo "Changed files:"
            echo "$changed_files" | grep -E '(^conformance/golden/|^conformance/fixtures/)' || true
          else
            echo "No golden output changes detected"
          fi
