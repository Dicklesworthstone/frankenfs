name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: ffs=debug

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Environment
        run: |
          echo "::group::System Info"
          uname -a
          cat /etc/os-release 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Rust Toolchain"
          rustc -Vv
          cargo -V
          echo "::endgroup::"
          echo "::group::Available Resources"
          nproc
          free -h 2>/dev/null || true
          df -h .
          echo "::endgroup::"

      - name: Forbidden dependency scan
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          forbidden = {
              "tokio",
              "tokio-stream",
              "tokio-util",
              "hyper",
              "hyper-rustls",
              "hyper-util",
              "reqwest",
              "axum",
              "tower",
              "tower-http",
              "tower-layer",
              "tower-service",
              "async-std",
              "smol",
          }

          lockfile = Path("Cargo.lock")
          if not lockfile.exists():
              print("::error file=Cargo.lock::Cargo.lock is required for dependency scanning")
              sys.exit(1)

          package_names = set(
              re.findall(r'^name = "([^"]+)"$', lockfile.read_text(encoding="utf-8"), re.MULTILINE)
          )
          found = sorted(package_names & forbidden)
          if found:
              print(
                  "::error title=Forbidden dependency detected::Cargo.lock contains "
                  f"forbidden async/runtime dependency package(s): {', '.join(found)}"
              )
              sys.exit(1)

          print("Forbidden dependency scan passed")
          PY

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Harness LOC growth guard
        if: github.event_name == 'pull_request'
        run: cargo run -p ffs-ops -- harness-loc-growth-guard --base origin/${{ github.base_ref }} --head HEAD --format github

      # bd-53dub: install the external oracles BEFORE the unit tests and require
      # them, so e2fsck / btrfs check assertions cannot pass by silently
      # returning when the tool is missing.
      - name: Install ext4/btrfs oracle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs fuse3
          # The unignored live TUI test uses fuser's auto-unmount helper.
          if ! grep -qxF user_allow_other /etc/fuse.conf; then
            printf '%s\n' user_allow_other | sudo tee -a /etc/fuse.conf
          fi

      # The mounted comparator's scratch-root guard only accepts paths under
      # /data/tmp (the offload hosts' scratch volume), and its unit tests
      # exercise that guard in place. Give the runner the same root.
      - name: Provide the /data/tmp scratch root
        run: |
          sudo mkdir -p /data/tmp
          sudo chmod 1777 /data/tmp

      - name: Generate native ext4 unit-test inputs
        run: |
          ./scripts/fixtures/make_ext4_fixtures.sh --images-only
          for image in tests/fixtures/images/ext4_*.img; do
            e2fsck -fn "$image"
          done

      # vendor/fuser is outside the workspace, so `--workspace` never runs its
      # tests. The FUSE_INTERRUPT routing FrankenFS added there (bd-gk01h) is
      # ours; run it with the ABI the workspace builds. (The filter skips
      # upstream tests that still assume a pre-7.42 reply layout.)
      - name: Vendored fuser interrupt tests
        run: cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 -- interrupt

      - name: Vendored fuser channel and shutdown controls
        run: |
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib -- channel::tests
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 -- channel::tests
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 -- mnt::fuse_pure::block_mount_tests::read_only
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 -- background_join
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 -- dispatch_join

      - name: Unit tests
        env:
          FFS_REQUIRE_ORACLES: "1"
        run: cargo test --workspace --no-fail-fast -- --nocapture

      # The ext4 reference and kernel-differential suites compare against
      # mkfs.ext4/debugfs output. Without e2fsprogs those tests report a skip
      # marker, which the evidence model classifies as Skipped rather than
      # Passed, so the step fails closed instead of passing vacuously.
      # btrfs-reference is deliberately not selected here: it additionally pins
      # btrfs-progs to the golden's anchor version.
      - name: Executed parity contracts
        run: |
          cargo run -p ffs-harness -- parity \
            --verify ext4-journal \
            --verify ext4-reference \
            --verify ext4-kernel-differential \
            --verify mvcc-lib \
            --verify repair-lib \
            --verify journal-lib \
            --verify ondisk-lib \
            --verify fuse-lib \
            --verify cli-e2e \
            --verify cli-bins \
            --verify core-lib \
            --verify btrfs-lib \
            --verify conformance \
            --verify profile-artifacts \
            --verify parity-honesty \
            --local

      # §22.1 names seven gate commands. This executes them and fails the job when
      # a gate that HAS tests does not pass. A filter that selects zero tests is
      # reported as `not_implemented` and can never be green here.
      - name: Canonical §22 gates
        run: |
          mkdir -p artifacts/canonical-gates
          cargo run -p ffs-harness -- gates --all --local --out artifacts/canonical-gates/report.json

      - name: ffs-block all-features check
        run: cargo check -p ffs-block --all-features --all-targets

      - name: ffs-block all-features tests
        run: cargo test -p ffs-block --all-features

  # Golden verification requires fixture images which are large.
  # This job regenerates them from scratch for consistent verification.
  golden-verification:
    name: Golden Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      SKIP_MOUNT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Environment
        run: |
          echo "::group::System Info"
          uname -a
          cat /etc/os-release 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Rust Toolchain"
          rustc -Vv
          cargo -V
          echo "::endgroup::"
          echo "::group::Available Resources"
          nproc
          free -h 2>/dev/null || true
          df -h .
          echo "::endgroup::"

      - name: Install ext4 tools for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Verify fixture checksums
        run: |
          set -euo pipefail
          if ! (cd conformance/fixtures && sha256sum -c checksums.sha256); then
            echo "::error file=conformance/fixtures/checksums.sha256::Checksum mismatch - fixtures changed without updating checksums"
            exit 1
          fi

      - name: Verify golden checksums
        run: |
          set -euo pipefail
          if ! (cd conformance/golden && sha256sum -c checksums.sha256); then
            echo "::error file=conformance/golden/checksums.sha256::Checksum mismatch - golden outputs changed without updating checksums"
            exit 1
          fi

      - name: Run canonical golden verification
        run: ./scripts/verify_golden.sh

      - name: Run smoke E2E
        run: ./scripts/e2e/ffs_smoke.sh

      # The xfstests steps fail closed unless the prerequisite preflight
      # (scripts/e2e/ffs_xfstests_preflight_e2e.sh) finds a built xfstests
      # tree, xfs/libaio headers, fsstress, FUSE and writable TEST_DIR /
      # SCRATCH_MNT. Provide them for real instead of relaxing the gate. The
      # tag is pinned so the curated subset is checked against a fixed tree.
      - name: Install xfstests build prerequisites
        run: |
          sudo apt-get install -y \
            build-essential autoconf automake libtool libtool-bin pkg-config \
            uuid-dev libacl1-dev libattr1-dev libaio-dev libgdbm-dev \
            libgdbm-compat-dev liburing-dev libcap-dev xfslibs-dev xfsprogs \
            fuse3 acl attr psmisc

      - name: Cache xfstests build
        id: xfstests-cache
        uses: actions/cache@v4
        with:
          path: ~/xfstests-dev
          key: xfstests-dev-v2026.03.20-${{ runner.os }}-v1

      - name: Build xfstests
        if: steps.xfstests-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2026.03.20 \
            https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git ~/xfstests-dev
          make -C ~/xfstests-dev -j"$(nproc)"

      - name: Expose xfstests tree and scratch directories
        run: |
          set -euo pipefail
          test -x ~/xfstests-dev/check
          test -x ~/xfstests-dev/ltp/fsstress
          mkdir -p "$RUNNER_TEMP/xfstests/test" "$RUNNER_TEMP/xfstests/scratch"
          {
            echo "XFSTESTS_DIR=$HOME/xfstests-dev"
            echo "TEST_DIR=$RUNNER_TEMP/xfstests/test"
            echo "SCRATCH_MNT=$RUNNER_TEMP/xfstests/scratch"
          } >>"$GITHUB_ENV"

      - name: Run xfstests subset planning (bd-32yn.7)
        env:
          XFSTESTS_MODE: plan
          XFSTESTS_FILTER: all
          XFSTESTS_STRICT: 1
        run: ./scripts/e2e/ffs_xfstests_e2e.sh

      - name: Run xfstests regression gate
        run: ./scripts/e2e/ffs_xfstests_regression_gate.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnostics
          if-no-files-found: warn
          path: |
            target/debug/deps/ffs-*.d
            conformance/golden/*.json
            conformance/fixtures/checksums.sha256
            artifacts/canonical-gates/report.json
            artifacts/e2e/**/*.log
            artifacts/e2e/**/xfstests/*.json
            artifacts/e2e/**/xfstests/*.md
            artifacts/e2e/**/xfstests/*.txt
            artifacts/e2e/**/xfstests/*.xml

  # FUSE E2E tests — mount a real ext4 image and exercise the VFS
  fuse-e2e:
    name: FUSE E2E
    runs-on: ubuntu-latest
    env:
      # Nested Cargo gates in the differential suite must share the runner's
      # writable build tree rather than defaulting to offload-host scratch.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install FUSE and ext4 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev e2fsprogs btrfs-progs dosfstools attr
          # fusermount3 needs this for fuser's automatic-unmount helper.
          if ! grep -qxF user_allow_other /etc/fuse.conf; then
            printf '%s\n' user_allow_other | sudo tee -a /etc/fuse.conf
          fi

      - name: Verify FUSE availability
        run: |
          ls -la /dev/fuse
          which fusermount3 || which fusermount
          echo "FUSE is available"

      - name: Build test binaries
        id: native_build
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          test -w "$CARGO_TARGET_DIR"
          cargo build --release -p ffs-cli --bin ffs-cli --bin ffs-protected-mount --bin ffs-fat
          cargo build --release -p ffs-repair --bin ffs-image-repair
          cargo test -p ffs-harness --no-run
          mkdir -p "$RUNNER_TEMP/ffs-cli-proof/bin" "$RUNNER_TEMP/ffs-cli-proof/artifacts"
          cp target/release/ffs-cli target/release/ffs-protected-mount target/release/ffs-fat target/release/ffs-image-repair "$RUNNER_TEMP/ffs-cli-proof/bin/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/ffs-cli-proof/source-revision.txt"
          rustc --version --verbose > "$RUNNER_TEMP/ffs-cli-proof/toolchain.txt"
          (cd "$RUNNER_TEMP/ffs-cli-proof" && sha256sum bin/*) > "$RUNNER_TEMP/ffs-cli-proof/sha256sums.txt"
          {
            echo "FFS_CLI_BIN=$RUNNER_TEMP/ffs-cli-proof/bin/ffs-cli"
            echo "FFS_PROTECTED_MOUNT_BIN=$RUNNER_TEMP/ffs-cli-proof/bin/ffs-protected-mount"
            echo "FFS_FAT_BIN=$RUNNER_TEMP/ffs-cli-proof/bin/ffs-fat"
            echo "FFS_IMAGE_REPAIR_BIN=$RUNNER_TEMP/ffs-cli-proof/bin/ffs-image-repair"
            echo "FFS_CLI_SOURCE_STAMP=$GITHUB_SHA"
            echo "FFS_CLI_ARTIFACT_DIR=$RUNNER_TEMP/ffs-cli-proof/artifacts"
          } >> "$GITHUB_ENV"

      - name: Retain native CLI binaries for host reproduction
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ffs-cli-proof/bin/
            ${{ runner.temp }}/ffs-cli-proof/source-revision.txt
            ${{ runner.temp }}/ffs-cli-proof/toolchain.txt
            ${{ runner.temp }}/ffs-cli-proof/sha256sums.txt

      - name: Run relocated ops tests
        # Keep independent native suites running after a test failure. The
        # original failure stays fatal; failed setup/builds and cancellation
        # still prevent admission of every test step below.
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        run: cargo test -p ffs-ops -- --nocapture

      - name: FUSE shutdown ownership and final-flush controls
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
        run: |
          cargo test -p ffs-fuse foreground_shutdown_observes_drop_time_final_flush -- --nocapture --test-threads=1
          cargo test -p ffs-fuse managed_shutdown_ -- --nocapture --test-threads=1

      - name: Preserve replacement mounts during shutdown
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        run: |
          cargo test --manifest-path vendor/fuser/Cargo.toml --lib --features abi-7-42 --no-run --message-format=json > "$RUNNER_TEMP/fuser-shutdown-build.jsonl"
          python3 - "$RUNNER_TEMP/fuser-shutdown-build.jsonl" "$RUNNER_TEMP/fuser-shutdown-path" <<'PY'
          import json, pathlib, sys
          executables = []
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              item = json.loads(line)
              if item.get('reason') == 'compiler-artifact' and item.get('executable') and item['target']['name'] == 'fuser' and item['profile']['test']:
                  executables.append(item['executable'])
          assert len(executables) == 1, executables
          pathlib.Path(sys.argv[2]).write_text(executables[0] + '\n')
          PY
          test_bin="$(cat "$RUNNER_TEMP/fuser-shutdown-path")"
          sudo unshare --mount --propagation private "$test_bin" auto_unmount_preserves_replacement_after_lazy_detach --nocapture --test-threads=1
          sudo unshare --mount --propagation private "$test_bin" read_only_auto_unmount_rejects_duplicate_device_descriptor --nocapture --test-threads=1

      - name: Live CLI telemetry on native ext4 and btrfs mounts
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
        run: cargo test -p ffs-cli --test cli_e2e cli_live_tui_one_process_observes_real_mounts_and_cleans_up -- --exact --nocapture --test-threads=1

      - name: Protected FAT32 NTFS and ZFS mounted repair
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        timeout-minutes: 20
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
          FFS_PROTECTED_MOUNT_E2E: "1"
        run: |
          set -euo pipefail
          cargo test -p ffs-cli --bin ffs-protected-mount -- bd_q19uk --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/protected-mount-repair.log"
          for filesystem in fat32 ntfs zfs; do
            grep -qxF "PROTECTED_MOUNT_RESULT|$filesystem|PASS" "$RUNNER_TEMP/protected-mount-repair.log"
          done
          for operation in format mkdir create replace rename unlink rmdir; do
            grep -qF "PROTECTED_FAT_CLI_RESULT|$operation|PASS|" "$RUNNER_TEMP/protected-mount-repair.log"
          done

      # bd-53dub: a mounted test that cannot mount fails here instead of
      # passing vacuously (FUSE, fuse3, e2fsprogs and btrfs-progs are installed
      # above, so a skip would mean the lane proved nothing).
      - name: Run FUSE E2E tests
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
        run: cargo test -p ffs-harness --test fuse_e2e -- --nocapture

      - name: Run shell E2E suites
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
          FFS_USE_RCH: "0"
        run: ./scripts/e2e/ffs_smoke.sh

      - name: Journaled ext4 write and recovery smoke
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
          FFS_USE_RCH: "0"
          FFS_SKIP_BUILD: "1"
        run: ./scripts/e2e/ffs_ext4_rw_smoke.sh

      - name: Native btrfs written-image differential
        id: btrfs_differential
        if: ${{ !cancelled() && steps.native_build.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
          FFS_USE_RCH: "0"
          FFS_SKIP_BUILD: "1"
        run: |
          set -o pipefail
          ./scripts/e2e/ffs_btrfs_progs_differential_e2e.sh | tee "$RUNNER_TEMP/btrfs-differential-positive.log"

      - name: Btrfs differential failure controls
        if: ${{ !cancelled() && steps.btrfs_differential.conclusion == 'success' }}
        env:
          FFS_REQUIRE_FUSE: "1"
          FFS_REQUIRE_ORACLES: "1"
          FFS_USE_RCH: "0"
          FFS_SKIP_BUILD: "1"
        run: |
          controls=$(mktemp -d "$RUNNER_TEMP/btrfs-differential-controls.XXXXXX")
          mkdir "$controls/bin"
          exec > >(tee "$controls/controller.log") 2>&1
          FFS_GATE_REAL_CARGO=$(command -v cargo)
          export FFS_GATE_REAL_CARGO
          # Only the negative invocations use this shim. Zero selection runs
          # real libtest; the final-command case deliberately exits 73.
          cat > "$controls/bin/cargo" <<'CARGO'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${FFS_GATE_NEGATIVE_MODE:-}:$1" in
            zero:test)
              echo 'PLANTED_NEGATIVE_ZERO_SELECTION' >&2
              exec "$FFS_GATE_REAL_CARGO" test -p ffs-btrfs --lib -- --exact __ffs_differential_must_select_zero_tests__
              ;;
            final:clippy)
              echo 'PLANTED_NEGATIVE_FINAL_COMMAND_FAILURE exit=73' >&2
              exit 73
              ;;
          esac
          exec "$FFS_GATE_REAL_CARGO" "$@"
          CARGO
          chmod +x "$controls/bin/cargo"

          expect_failure() {
            local name="$1" expected="$2"
            shift 2
            local log="$controls/$name.log" code=0
            "$@" > "$log" 2>&1 || code=$?
            cat "$log"
            printf 'PLANTED_NEGATIVE_RESULT|case=%s|exit=%s\n' "$name" "$code"
            test "$code" -ne 0
            python3 - "$RUNNER_TEMP/btrfs-differential-positive.log" "$log" "$name" "$expected" "$denied" <<'PY'
          import pathlib, re, sys
          baseline_path, log_path, name, expected_csv, denied_target = sys.argv[1:]
          pattern = re.compile(r'^SCENARIO_RESULT\|scenario_id=([^|]+)\|outcome=([^|]+)\|', re.M)
          def scenarios(text):
              result = {}
              for key, outcome in pattern.findall(text):
                  assert result.setdefault(key, outcome) == outcome, (key, result, outcome)
              assert result, 'no scenario results executed'
              return result
          baseline = scenarios(pathlib.Path(baseline_path).read_text())
          assert all(value == 'PASS' for value in baseline.values()), baseline
          required = {'ffs_mount_rw', 'ffs_mutations_reopened', 'ffs_written_btrfs_check',
                      'writeback_unit_tests', 'crash_consistency_tests', 'clippy_clean',
                      'btrfs_progs_differential_overall'}
          assert required <= baseline.keys(), baseline
          text = pathlib.Path(log_path).read_text()
          actual = scenarios(text)
          expected = set(expected_csv.split(','))
          assert actual.keys() == (expected if name == 'oracle' else baseline.keys()), actual
          assert {key for key, value in actual.items() if value != 'PASS'} == expected, actual
          assert all(actual[key] == 'FAIL' for key in expected), actual
          directory = pathlib.Path(re.search(r'^Log directory: (.+)$', text, re.M)[1])
          if name == 'target':
              for file in ['writeback_tests.log', 'crash_consistency_tests.log', 'clippy.log']:
                  raw = (directory / file).read_text()
                  assert denied_target and denied_target in raw and 'Permission denied' in raw, file
          elif name == 'zero':
              for file in ['writeback_tests.log', 'crash_consistency_tests.log']:
                  raw = (directory / file).read_text()
                  assert 'PLANTED_NEGATIVE_ZERO_SELECTION' in raw, file
                  assert 'test result: ok. 0 passed; 0 failed;' in raw, file
          elif name == 'final':
              assert 'PLANTED_NEGATIVE_FINAL_COMMAND_FAILURE exit=73' in (directory / 'clippy.log').read_text()
          elif name == 'oracle':
              assert 'mkfs.btrfs not found' in text
          print(f'DIFFERENTIAL_NEGATIVE_PASS|case={name}|rejected={sorted(expected)}')
          PY
          }

          denied=$(mktemp -d "$RUNNER_TEMP/btrfs-denied-target.XXXXXX")
          chmod 0555 "$denied"
          test ! -w "$denied"
          expect_failure target writeback_unit_tests,crash_consistency_tests,clippy_clean,btrfs_progs_differential_overall \
            env CARGO_TARGET_DIR="$denied" ./scripts/e2e/ffs_btrfs_progs_differential_e2e.sh
          expect_failure zero writeback_unit_tests,crash_consistency_tests,btrfs_progs_differential_overall \
            env PATH="$controls/bin:$PATH" FFS_GATE_NEGATIVE_MODE=zero ./scripts/e2e/ffs_btrfs_progs_differential_e2e.sh
          expect_failure final clippy_clean,btrfs_progs_differential_overall \
            env PATH="$controls/bin:$PATH" FFS_GATE_NEGATIVE_MODE=final ./scripts/e2e/ffs_btrfs_progs_differential_e2e.sh
          if PATH=/usr/bin:/bin command -v mkfs.btrfs; then
            echo 'missing-oracle control requires mkfs.btrfs outside /usr/bin:/bin' >&2
            exit 1
          fi
          expect_failure oracle btrfs_progs_capability_check \
            env PATH=/usr/bin:/bin ./scripts/e2e/ffs_btrfs_progs_differential_e2e.sh

      - name: Collect FUSE helper diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts/e2e/fuse-helper-diagnostics
          {
            uname -a
            fusermount3 --version
            id
          } > artifacts/e2e/fuse-helper-diagnostics/environment.log
          sudo journalctl -k --since '-30min' --no-pager > artifacts/e2e/fuse-helper-diagnostics/kernel.log
          if sudo cat /sys/kernel/security/apparmor/profiles > artifacts/e2e/fuse-helper-diagnostics/apparmor.log 2>&1; then
            cat artifacts/e2e/fuse-helper-diagnostics/apparmor.log
          else
            profile_read_status=$?
            printf 'AppArmor profile list unavailable (exit %s); command error retained below.\n' "$profile_read_status"
            cat artifacts/e2e/fuse-helper-diagnostics/apparmor.log
          fi

      - name: Retain E2E and differential control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse-e2e-diagnostics
          if-no-files-found: warn
          path: |
            artifacts/e2e/**/*.log
            artifacts/e2e/**/*.json
            ${{ runner.temp }}/btrfs-differential-positive.log
            ${{ runner.temp }}/btrfs-differential-controls.*/*.log
            ${{ runner.temp }}/protected-mount-repair.log
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/*.log
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/*.json
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/*.stdout
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/*.stderr
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/expected
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/new-payload
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/image
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/sidecar
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/fsync.image
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/fsync.sidecar
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/formatted.fat16
            ${{ runner.temp }}/ffs-cli-proof/artifacts/ffs-protected-mount-*/formatted.sidecar
            /tmp/ffs-live-tui-*/*.log
            /tmp/ffs-live-tui-*/*-profile.stdout
            /tmp/ffs-live-tui-*/*-profile.stderr

  # Warn if goldens are modified in a PR
  golden-change-check:
    name: Golden Change Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for golden changes
        run: |
          changed_files="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          if echo "$changed_files" | grep -qE '(^conformance/golden/|^conformance/fixtures/)'; then
            echo "::warning::Golden outputs modified - ensure this is intentional"
            echo ""
            echo "Changed files:"
            echo "$changed_files" | grep -E '(^conformance/golden/|^conformance/fixtures/)' || true
          else
            echo "No golden output changes detected"
          fi
