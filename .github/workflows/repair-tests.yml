name: Repair Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/ffs-repair/**'
      - 'crates/ffs-block/**'
      - 'crates/ffs-types/**'
      - 'crates/ffs-error/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/repair-tests.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install independent ext4 recovery oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
      - name: Compile and run repair tests
        run: cargo test -p ffs-repair --locked
      - name: Repair Clippy
        run: cargo clippy -p ffs-repair --locked --all-targets -- -D warnings
      - name: Repair formatting
        run: cargo fmt -p ffs-repair --check
      - name: Capture formatter diagnostics on failure
        if: failure()
        run: |
          cargo fmt -p ffs-repair
          git diff --check
          git diff --stat
      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-source-diagnostics-${{ matrix.runner }}
          retention-days: 7
          path: |
            Cargo.lock
            crates/ffs-repair/src/sidecar.rs
            crates/ffs-repair/src/sidecar_restore.rs
            crates/ffs-repair/src/bin/ffs-image-repair.rs
            crates/ffs-repair/tests/sidecar_cli.rs

  inspect-btrfs-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact tracked sources and device-routing beads
        run: |
          git rev-parse HEAD
          git archive --format=tar HEAD crates vendor Cargo.toml Cargo.lock rust-toolchain.toml .cargo .beads/issues.jsonl AGENTS.md PLAN_TO_PORT_FRANKENFS_TO_RUST.md COMPREHENSIVE_SPEC_FOR_FRANKENFS_V1.md EXISTING_EXT4_BTRFS_STRUCTURE.md .github/workflows > "$RUNNER_TEMP/frankenfs-source.tar"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for line in Path('.beads/issues.jsonl').read_text().splitlines():
              item = json.loads(line)
              if item['id'] in {'bd-j9k3y', 'bd-m5fwf', 'bd-6d4wn', 'bd-hk5w3', 'bd-j7a4e'}:
                  print(json.dumps(item))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-btrfs-source
          retention-days: 1
          path: ${{ runner.temp }}/frankenfs-source.tar
