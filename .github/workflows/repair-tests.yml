name: Repair Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/ffs-repair/**'
      - 'crates/ffs-block/**'
      - 'crates/ffs-types/**'
      - 'crates/ffs-error/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/repair-tests.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install independent ext4 recovery oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
      - name: Compile and run repair tests
        run: cargo test -p ffs-repair --locked
      - name: Repair Clippy
        run: cargo clippy -p ffs-repair --locked --all-targets -- -D warnings
      - name: Repair formatting
        run: cargo fmt -p ffs-repair --check
      - name: Capture formatter diagnostics on failure
        if: failure()
        run: |
          cargo fmt -p ffs-repair
          git diff --check
          git diff --stat
      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-source-diagnostics-${{ matrix.runner }}
          retention-days: 7
          path: |
            Cargo.lock
            crates/ffs-repair/src/sidecar.rs
            crates/ffs-repair/src/sidecar_restore.rs
            crates/ffs-repair/src/bin/ffs-image-repair.rs
            crates/ffs-repair/tests/sidecar_cli.rs
