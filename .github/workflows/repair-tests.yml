name: Repair Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/ffs-repair/**'
      - 'crates/ffs-block/**'
      - 'crates/ffs-types/**'
      - 'crates/ffs-error/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/repair-tests.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install independent ext4 recovery oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
      - name: Compile and run repair tests
        run: cargo test -p ffs-repair --locked
      - name: Repair Clippy
        run: cargo clippy -p ffs-repair --locked --all-targets -- -D warnings
      - name: Repair formatting
        run: cargo fmt -p ffs-repair --check
      - name: Capture formatter diagnostics on failure
        if: failure()
        run: |
          cargo fmt -p ffs-repair
          git diff --check
          git diff --stat
      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-source-diagnostics-${{ matrix.runner }}
          retention-days: 7
          path: |
            Cargo.lock
            crates/ffs-repair/src/sidecar.rs
            crates/ffs-repair/src/sidecar_restore.rs
            crates/ffs-repair/src/bin/ffs-image-repair.rs
            crates/ffs-repair/tests/sidecar_cli.rs

  # Temporary source preparation, not a validation gate or automatic commit.
  # Remove this job in the explicit API commit that lands the reviewed blobs.
  prepare-reviewed-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Dicklesworthstone/frankenfs'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Fetch the immutable reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Dicklesworthstone/frankenfs/git/blobs/ce5b9d784d8c4cf2f040480bd11fab8558580113 --jq .content | base64 --decode > "$RUNNER_TEMP/recovery-reviewed.patch"
          test "$(git hash-object "$RUNNER_TEMP/recovery-reviewed.patch")" = ce5b9d784d8c4cf2f040480bd11fab8558580113
      - name: Check baseline identities and apply the reviewed patch
        run: |
          test "$(git hash-object crates/ffs-repair/src/recovery.rs)" = daaca7734792e10f7bf18eb1405428680efbd190
          test "$(git hash-object crates/ffs-repair/src/storage/integrity.rs)" = e0cf7f9a9dfb1ad342d8ff692226e104d1f86abc
          test "$(git hash-object crates/ffs-repair/src/pipeline.rs)" = b335dcb4d12b432cd76fe637968a4e30a12c8dcb
          git apply --check --recount "$RUNNER_TEMP/recovery-reviewed.patch"
          git apply --recount "$RUNNER_TEMP/recovery-reviewed.patch"
          test "$(git hash-object crates/ffs-repair/src/recovery.rs)" = 7a3d1ed73abae9bbbb843bef78fe458857a5ed5a
          cargo fmt -p ffs-repair
          git diff --check
          git diff --stat
          git diff -- crates/ffs-repair/src/pipeline.rs crates/ffs-repair/src/storage/integrity.rs
      - name: Export only immutable reviewed source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          paths = (
              'crates/ffs-repair/src/recovery.rs',
              'crates/ffs-repair/src/pipeline.rs',
              'crates/ffs-repair/src/storage/integrity.rs',
              'crates/ffs-repair/src/recovery/erasure.rs',
              'crates/ffs-repair/src/recovery/erasure/symbols.rs',
          )
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed.issubset(set(paths)):
              raise SystemExit('Unexpected changed path; refusing export')
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/frankenfs/git/blobs',
                  data=body,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'frankenfs-reviewed-source-preparation',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result['sha'] != expected:
                  raise SystemExit('Blob identity mismatch')
              print(json.dumps({'path': path, 'sha': expected, 'bytes': len(data)}), flush=True)
          PY
