name: Native capability removal validation
on:
  push:
    branches: [validation/ffs-killpriv-20261124]
permissions:
  contents: read
concurrency:
  group: ffs-killpriv-20261124
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: "-Z threads=1"
  CARGO_HTTP_USER_AGENT: "frankenfs-agent (+https://github.com/Dicklesworthstone/frankenfs)"
  FFS_BASE_COMMIT: 000301d215e6a350d948624a7f7e049f8c2ab2e7
  FFS_SOURCE_PATHS: |
    crates/ffs-zfs/src/transaction/zpl_ops.rs
    crates/ffs-zfs/tests/persistence_prefix.rs
    crates/ffs-zfs/tests/persistence_prefix/writable_fs.rs
    crates/ffs-zfs/tests/persistence_prefix/setid.rs
    crates/ffs-zfs/src/filesystem.rs
    crates/ffs-zfs/src/filesystem/writable.rs
    crates/ffs-zfs/src/reader/dmu/zpl/xattrs.rs
    crates/ffs-zfs/src/transaction.rs
    crates/ffs-core/src/lib.rs
  FFS_VALIDATION_WORKFLOW: .github/workflows/ffs-mutation-validation.yml
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tree: ${{ steps.source.outputs.tree }}
      sources: ${{ steps.source.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned formatter
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Format and record exact source blobs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --check
          git diff --check
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          paths = os.environ["FFS_SOURCE_PATHS"].split()
          assert paths and len(paths) == len(set(paths))
          allowed = set(paths)
          workflow = os.environ["FFS_VALIDATION_WORKFLOW"]
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          changes = set(git("diff", "--name-only", os.environ["FFS_BASE_COMMIT"], "HEAD").splitlines())
          assert changes <= allowed | {workflow}, sorted(changes - allowed - {workflow})
          formatted = set(git("diff", "--name-only", "HEAD").splitlines())
          assert formatted <= allowed, sorted(formatted - allowed)
          records = []
          for name in paths:
              path = pathlib.Path(name)
              assert path.is_file() and not path.is_symlink(), name
              raw = path.read_bytes()
              blob = git("hash-object", name)
              digest = hashlib.sha256(raw).hexdigest()
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/git/blobs",
                  data=json.dumps({"encoding": "base64", "content": base64.b64encode(raw).decode("ascii")}).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "frankenfs-agent (+https://github.com/Dicklesworthstone/frankenfs)",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result["sha"] == blob, (name, result["sha"], blob)
              records.append({"path": name, "blob": blob, "sha256": digest})
              print(f"FFS_FORMATTED_BLOB|{name}|{blob}|{digest}", flush=True)
          subprocess.run(["git", "add", "--", *paths], check=True)
          tree = git("write-tree")
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          print("FFS_TESTED_COMMIT|" + os.environ["GITHUB_SHA"])
          print("FFS_TESTED_BASE|" + os.environ["FFS_BASE_COMMIT"])
          print("FFS_TESTED_TREE|" + tree)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("tree=" + tree, file=output)
              print("sources=" + json.dumps(records, separators=(",", ":")), file=output)
          PY
  validate:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      FFS_EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
      FFS_EXPECTED_SOURCES: ${{ needs.prepare.outputs.sources }}
      FFS_REQUIRE_ORACLES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned compiler and native oracles
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs ntfs-3g dosfstools mtools fuse3 pkg-config libfuse3-dev zfsutils-linux
          validation_swap=$(sudo mktemp /mnt/ffs-mutation-XXXXXX.swap)
          sudo fallocate -l 12G "$validation_swap"
          sudo chmod 0600 "$validation_swap"
          sudo mkswap "$validation_swap"
          sudo swapon "$validation_swap"
          command -v mkfs.ext4 e2fsck debugfs zdb
          free -h
          df -h .
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ntfs-writer-integrity
          cache-on-failure: "true"
          cache-workspace-crates: "true"
      - name: Verify exact formatted source
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          records = json.loads(os.environ["FFS_EXPECTED_SOURCES"])
          paths = os.environ["FFS_SOURCE_PATHS"].split()
          assert len(records) == len(paths)
          assert {record["path"] for record in records} == set(paths)
          for record in records:
              path = pathlib.Path(record["path"])
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"], str(path)
              blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
              assert blob == record["blob"], str(path)
          subprocess.run(["git", "add", "--", *paths], check=True)
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          assert tree == os.environ["FFS_EXPECTED_TREE"], tree
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          print("FFS_SOURCE_VERIFIED|" + tree)
          PY
          cargo fmt --check
          git diff --check
      - name: Workspace compiler gate
        run: cargo check --locked --workspace --all-targets
      - name: Workspace strict Clippy gate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: ZFS library, capability, native zdb and persistence regressions
        run: cargo test --locked -p ffs-zfs -- --test-threads=1
      - name: Confirm tested source stayed unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$FFS_EXPECTED_TREE"
          echo "FFS_MUTATION_GATES_PASS|$FFS_EXPECTED_TREE"
