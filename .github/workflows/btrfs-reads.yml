name: Btrfs Read Recovery

on:
  push:
    branches: [main]
    paths:
      - 'crates/ffs-core/**'
      - 'crates/ffs-btrfs/**'
      - 'crates/ffs-ondisk/**'
      - 'crates/ffs-block/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/btrfs-reads.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  btrfs-reads:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install filesystem fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs
      - name: Core library regressions
        run: cargo test -p ffs-core --locked --lib
      - name: Core Clippy
        run: cargo clippy -p ffs-core --locked --all-targets -- -D warnings
      - name: Core formatting
        run: cargo fmt -p ffs-core --check
