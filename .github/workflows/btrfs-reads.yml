name: Btrfs Read Recovery

on:
  push:
    branches: [main]
    paths:
      - 'crates/ffs-core/**'
      - 'crates/ffs-alloc/**'
      - 'crates/ffs-btrfs/**'
      - 'crates/ffs-ondisk/**'
      - 'crates/ffs-block/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/fixtures/make_ext4_fixtures.sh'
      - '.github/workflows/btrfs-reads.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  btrfs-reads:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install filesystem fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs
      - name: Generate native ext4 unit-test inputs
        run: |
          ./scripts/fixtures/make_ext4_fixtures.sh --images-only
          for image in tests/fixtures/images/ext4_*.img; do
            e2fsck -fn "$image"
          done
      - name: Core library regressions
        env:
          FFS_REQUIRE_ORACLES: "1"
        run: |
          cargo test -p ffs-alloc --locked --lib
          cargo test -p ffs-error --locked --lib
          cargo test -p ffs-alloc --locked --lib --features bhh0i_sharded_alloc
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_file_ -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_repair_tail_ -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_sdk_write_ -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_special_files_pass_e2fsck -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc immutable_and_append_attributes_enforced_on_writes_bd_hbld5 -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc write_past_max_file_size_returns_efbig -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_write_at_the_last_logical_block_and_one_past_it -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc ext4_eager_concurrent_storm_is_consistent_bd_hyysq -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc writer_snapshot_reads_reject_newer_ancestors_and_preserve_staged_bytes -- --nocapture
          cargo test -p ffs-core --locked --lib --features bhh0i_sharded_alloc tests::ext4_sharded_birth_cross_group_fallback_passes_native_checker -- --exact --nocapture
          cargo test -p ffs-core --locked --lib tests::acl_stored_corruption_preserves_error_origin_and_aborts_metadata_mutation -- --exact --nocapture
          cargo test -p ffs-core --locked --lib tests::ext4_exchange_rechecks_protected_parents_and_inodes -- --exact --nocapture
          cargo test -p ffs-core --locked --lib tests::ext4_write_extent_cache_obeys_pristine_snapshot_and_staged_mappings -- --exact --nocapture
          cargo test -p ffs-core --locked --lib tests::ext4_write_cross_call_extent_snapshot_golden_bd_pqzev -- --exact --nocapture
          cargo test -p ffs-core --locked --lib tests::write_fallocate_punch_hole_without_keep_size_returns_einval -- --exact --nocapture
          cargo test -p ffs-core --locked --lib
      - name: Core Clippy
        run: cargo clippy -p ffs-core --locked --all-targets -- -D warnings
      - name: Core formatting
        run: cargo fmt -p ffs-core --check
