name: Filesystem integrity validation
on:
  push:
    branches:
      - validation/ffs-integrity-20261112
      - validation/native-writers-20261114
      - validation/ntfs-replacement-20261115
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CFLAGS: "-g0 -O2"
jobs:
  required-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-workspace-crates: "true"
      - name: Source identity
        run: |
          git rev-parse HEAD
          rustc -Vv
          git diff --check
          free -h
          df -h .
      - name: Workspace formatting
        run: cargo fmt --check
      - name: Workspace compiler check
        if: ${{ !cancelled() }}
        run: cargo check --locked --workspace --all-targets
      - name: Workspace clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install native filesystem oracles
        if: ${{ !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y ntfs-3g zfsutils-linux
      - name: Native NTFS journal reservation tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-ondisk ntfs::logfile_writer::tests
      - name: Native NTFS security descriptor and change journal regression tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p ffs-ondisk --lib ntfs_security -- --nocapture
          cargo test --locked -p ffs-ondisk --lib ntfs::usn -- --nocapture
      - name: Complete MVCC tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-mvcc
      - name: Repair refresh capture and publication regressions
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p ffs-repair --lib refresh_ -- --test-threads=1
          cargo test --locked -p ffs-repair --lib source_block_digest_manifest_roundtrip_and_tamper_detection_bd_jufod -- --test-threads=1
      - name: Repair CLI publication regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-cli --bin ffs-cli repair_rebuild_ -- --test-threads=1
      - name: Complete ZFS tests, persistence cuts, and native zdb oracle
        if: ${{ !cancelled() }}
        env:
          FFS_REQUIRE_ORACLES: "1"
        run: cargo test --locked -p ffs-zfs
      - name: Native ZPL metadata codec tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-ondisk --lib zfs_zpl::tests
      - name: Complete NTFS tests and persistence cuts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-ntfs
      - name: NTFS CLI consumer tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-cli --bin ffs-ntfs
      - name: Native NTFS CLI range and truncate round trip
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-cli --test cli_e2e native_ntfs_range_edit_cli_preserves_bytes_bounds_and_volume_selection -- --ignored --exact --nocapture
      - name: Native NTFS named stream persistence and volume bounds
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test_name=native_ntfs_named_stream_edits_preserve_other_data_and_volume_bounds
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --list | tee "$RUNNER_TEMP/ntfs-named-stream-tests.txt"
          grep -Fx "$test_name: test" "$RUNNER_TEMP/ntfs-named-stream-tests.txt"
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --nocapture
      - name: Native NTFS named stream creation and removal
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ffs-cli --test cli_e2e native_ntfs_named_stream_catalog_cli_preserves_native_data_and_allocation -- --ignored --exact --nocapture
      - name: Native NTFS hard-link lifecycle and volume bounds
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test_name=native_ntfs_hardlinks_preserve_identity_data_and_volume_bounds
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --list | tee "$RUNNER_TEMP/ntfs-hard-link-tests.txt"
          grep -Fx "$test_name: test" "$RUNNER_TEMP/ntfs-hard-link-tests.txt"
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --nocapture

      - name: Native NTFS replacement rename and stream reclamation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test_name=native_ntfs_replace_rename_preserves_aliases_and_reclaims_retired_streams
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --list | tee "$RUNNER_TEMP/ntfs-replacement-tests.txt"
          grep -Fx "$test_name: test" "$RUNNER_TEMP/ntfs-replacement-tests.txt"
          cargo test --locked -p ffs-cli --test cli_e2e "$test_name" -- --ignored --exact --nocapture
