[workspace]
resolver = "2"
members = [
    "crates/ffs-types",
    "crates/ffs-error",
    "crates/ffs-ondisk",
    "crates/ffs-block",
    "crates/ffs-journal",
    "crates/ffs-mvcc",
    "crates/ffs-btree",
    "crates/ffs-alloc",
    "crates/ffs-inode",
    "crates/ffs-dir",
    "crates/ffs-extent",
    "crates/ffs-xattr",
    "crates/ffs-fuse",
    "crates/ffs-repair",
    "crates/ffs-core",
    "crates/ffs",
    "crates/ffs-cli",
    "crates/ffs-tui",
    "crates/ffs-harness",
    "tools/ffs-ops",
    # Legacy crates (retained for extraction reference)
    "crates/ffs-ext4",
    "crates/ffs-btrfs",
]
exclude = ["vendor/fuser"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankenfs"
# Corrected 2026-08-05 (bd-g9l54). "1.85" was never true: rust-toolchain.toml pins
# nightly-2026-07-20 (rustc 1.99), the crates are edition 2024, and the code calls
# APIs stabilized in 1.95 (`Atomic{I64,U64}::try_update`, and the per-core and FUSE
# store paths). `clippy::incompatible_msrv` was reporting exactly that mismatch, so
# the fix is to stop declaring a floor the workspace does not support — not to
# silence the lint.
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Debug impls deliberately omit large payload fields.
missing_fields_in_debug = "allow"
# Readable incremental string building in cold paths.
format_push_string = "allow"
# usize->u32 casts on values bounded by the on-disk format.
cast_possible_truncation = "allow"
# Doc prose shape only.
too_long_first_doc_paragraph = "allow"
# Helper items declared next to the code that uses them.
items_after_statements = "allow"
# Guards deliberately span the critical section.
significant_drop_tightening = "allow"
# A few long state machines that read worse when split.
too_many_lines = "allow"
# Flag records mirroring an on-disk layout.
struct_excessive_bools = "allow"
# Suggests #[must_use] on internal accessors; not part of the API contract.
must_use_candidate = "allow"
# New lint; asks for assert_eq!(x, "") instead of assert!(x.is_empty()) purely to
# improve the failure message. Fires on dozens of assertions with no defect behind
# any, and the rewrite is type-specific so clippy --fix cannot apply it.
assert_is_empty = "allow"
# Arms kept separate where each documents a distinct case.
branches_sharing_code = "allow"
# Underscore-prefixed helpers referenced across module boundaries.
used_underscore_items = "allow"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }

[workspace.dependencies]
# External dependencies
anyhow = "1.0.104"
arc-swap = "1.9.2"
bitflags = "2.13.1"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
crc32c = "0.6.8"
ctrlc = "3.5.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
crossbeam-epoch = "0.9.20"
hex = "0.4.3"
insta = "1.48.0"
libc = "0.2.189"
loom = "0.7.2"
memchr = "2.8.3"
parking_lot = "0.12.5"
proptest = "1.11.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
smallvec = { version = "1.15.2", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
trybuild = "1.0.118"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
xxhash-rust = { version = "0.8.18", features = ["xxh3", "xxh64"] }
fuser = { version = "0.17.0", features = ["abi-7-42"] }
zstd = "0.13.3"
brotli = "8.0.4"
# zlib-rs backend: a pure-safe-Rust reimplementation of zlib that inflates
# markedly faster than the default `miniz_oxide` (rust_backend) — the btrfs
# compressed-read path (btrfs_decompress, ZLIB) was ~25% self-time in
# `miniz_oxide::inflate::core::init_tree` on cold/uncached decompression
# (bd-cc-zlib-rs). No C toolchain (unlike zlib-ng); output is byte-identical
# DEFLATE. Compatible with the workspace `unsafe_code = "forbid"` (the lint
# scopes to our crates, not deps).
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
lzokay-native = "0.1"
nix = { version = "0.29", features = ["fs", "uio"] }
xattr = "1.6.1"

# Sibling project dependencies (crates.io; local path overrides via [patch] if needed)
asupersync = { version = "0.3.9", features = ["test-internals"] }
ftui = "0.3.1"

# Workspace crate cross-references
ffs = { path = "crates/ffs" }
ffs-alloc = { path = "crates/ffs-alloc" }
ffs-block = { path = "crates/ffs-block" }
ffs-btree = { path = "crates/ffs-btree" }
ffs-btrfs = { path = "crates/ffs-btrfs" }
ffs-cli = { path = "crates/ffs-cli" }
ffs-core = { path = "crates/ffs-core" }
ffs-dir = { path = "crates/ffs-dir" }
ffs-error = { path = "crates/ffs-error" }
ffs-ext4 = { path = "crates/ffs-ext4" }
ffs-extent = { path = "crates/ffs-extent" }
ffs-fuse = { path = "crates/ffs-fuse" }
ffs-harness = { path = "crates/ffs-harness" }
ffs-ops = { path = "tools/ffs-ops" }
ffs-inode = { path = "crates/ffs-inode" }
ffs-journal = { path = "crates/ffs-journal" }
ffs-mvcc = { path = "crates/ffs-mvcc" }
ffs-ondisk = { path = "crates/ffs-ondisk" }
ffs-repair = { path = "crates/ffs-repair" }
ffs-tui = { path = "crates/ffs-tui" }
ffs-types = { path = "crates/ffs-types" }
ffs-xattr = { path = "crates/ffs-xattr" }

[patch.crates-io]
# The vendored fuser forwards unrestricted ioctls so ext4/btrfs FIEMAP and
# EXT4_IOC_* parity tests exercise the real FrankenFS userspace handlers.
fuser = { path = "vendor/fuser" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
opt-level = 3
debug = "line-tables-only"
strip = false
lto = "thin"
